; BosqueGrande hosted edition PHP settings.
expose_php = Off
display_errors = Off
log_errors = On
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 60
; No shell access from PHP. This has to live in an ini file: PHP ignores
; disable_functions set from the Apache configuration. It applies to wp-cli
; too, which the hosted scripts do not need shell functions for.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
